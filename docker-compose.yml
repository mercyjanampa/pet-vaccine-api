services:
  mysql:
    image: mysql:8.4
    container_name: petvax-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 2323
      MYSQL_DATABASE: pet_vaccine_db
    ports:
      - "3307:3306"
    volumes:
      - petvax_mysql_data:/var/lib/mysql

volumes:
  petvax_mysql_data: