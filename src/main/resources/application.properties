spring.application.name=pet-vaccine-api

spring.datasource.url=jdbc:mysql://localhost:3307/pet_vaccine_db
spring.datasource.username=root
spring.datasource.password=2323

# Hibernate ya no modifica la base de datos.
# Solo comprueba que coincida con nuestras entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway administra los cambios de la base de datos.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# La base actual ya exist�a antes de incorporar Flyway.
# Se toma como nuestra versi�n inicial.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8081

spring.config.import=optional:file:.env[.properties]

jwt.secret=${JWT_SECRET}